name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main  # Change to master if your default branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neuroncli/auth-server/package-lock.json

      - name: Verify production code
        working-directory: neuroncli/auth-server
        run: |
          npm ci
          node build-sitemap.mjs
          npm run check:production
          npm run check:database
          npm audit --omit=dev

      # MANUAL STEP: this workflow never touches the database. Before merging a change that adds
      # files under neuroncli/auth-server/migrations/, apply them to the production Supabase
      # project yourself (in order, e.g. `supabase db push` or the SQL editor), then merge.
      # The Worker expects the RPCs listed in neuroncli/auth-server/docs/PLATFORM_CONTRACT.md §4.
      - name: Database migrations (manual)
        run: echo "::notice title=Database migrations::Migrations are applied manually before merge. This workflow does not run them."

      # Only the database secret is required. Provider keys can live in the provider key vault
      # (dashboard.zero-x.live/admin/keys, encrypted under PROVIDER_KEYS_KEK) instead of GitHub
      # secrets; the provider secrets below then only serve as the fallback pool. Every optional
      # secret that is missing is skipped (its feature stays disabled) instead of failing the
      # deploy. Only secret names are printed, never values. ANTHROPIC_API_KEY serves Claude
      # Sonnet 5.5 and Opus 5.5 (paid pools, Pro and Max) and the weekly discovery research jobs;
      # a new secret must be listed in OPTIONAL_SECRETS and in both env blocks to reach the Worker.
      - name: Select configured Worker secrets
        id: worker-secrets
        env:
          REQUIRED_SECRETS: SUPABASE_SECRET_KEY
          OPTIONAL_SECRETS: GROQ_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY NVIDIA_API_KEY RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET GATEWAY_ADMIN_TOKEN GROQ_PAID_API_KEY GEMINI_PAID_API_KEY SESSION_ENCRYPTION_KEY DEVICE_APPROVAL_SECRET PROVIDER_KEYS_KEK ANTHROPIC_API_KEY
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GATEWAY_ADMIN_TOKEN: ${{ secrets.GATEWAY_ADMIN_TOKEN }}
          GROQ_PAID_API_KEY: ${{ secrets.GROQ_PAID_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          DEVICE_APPROVAL_SECRET: ${{ secrets.DEVICE_APPROVAL_SECRET }}
          PROVIDER_KEYS_KEK: ${{ secrets.PROVIDER_KEYS_KEK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          names=""
          for name in $REQUIRED_SECRETS; do
            if [ -z "${!name}" ]; then echo "::error::Required secret $name is not set"; exit 1; fi
            names="${names}${name}"$'\n'
          done
          for name in $OPTIONAL_SECRETS; do
            if [ -n "${!name}" ]; then names="${names}${name}"$'\n'
            else echo "::warning::Optional secret $name is not set; the feature that needs it stays disabled"; fi
          done
          {
            echo 'names<<ZX_SECRET_NAMES'
            printf '%s' "$names"
            echo 'ZX_SECRET_NAMES'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.147.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'neuroncli/auth-server'
          secrets: ${{ steps.worker-secrets.outputs.names }}
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GATEWAY_ADMIN_TOKEN: ${{ secrets.GATEWAY_ADMIN_TOKEN }}
          GROQ_PAID_API_KEY: ${{ secrets.GROQ_PAID_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          DEVICE_APPROVAL_SECRET: ${{ secrets.DEVICE_APPROVAL_SECRET }}
          PROVIDER_KEYS_KEK: ${{ secrets.PROVIDER_KEYS_KEK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
