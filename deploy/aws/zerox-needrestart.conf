# /etc/needrestart/conf.d/60-zerox-gateway.conf (root, 0644), installed by host-setup.sh.
#
# needrestart runs after every apt run (unattended upgrades included) and, with the cloud-init's
# $nrconf{restart} = 'a', restarts each service whose binary or libraries were replaced. It never
# restarts a gateway instance: `systemctl restart zerox-gateway@N` closes the only listener on
# 127.0.0.1:8787 for the whole drain (up to 110 s), and cloudflared answers 502 meanwhile.
# zerox-gateway-refresh swaps the instances instead, the way a deploy does (zerox-apt-refresh.conf).
# Every other service keeps needrestart's behaviour.
$nrconf{override_rc}{qr(^zerox-gateway\@\d+\.service$)} = 0;
