// /etc/apt/apt.conf.d/80zerox-gateway-refresh (root, 0644), installed by host-setup.sh.
//
// After every dpkg run (unattended upgrades included), start zerox-gateway-refresh.service: when a
// running gateway instance maps a file the upgrade replaced (node from NodeSource, libc,
// libstdc++), it activates the current release again, so the idle instance takes the new files
// before the old one drains (needrestart leaves the gateway alone: zerox-needrestart.conf).
// --no-block: apt does not wait for the swap (up to about 4 minutes), and it never fails apt.
DPkg::Post-Invoke { "systemctl start --no-block zerox-gateway-refresh.service >/dev/null 2>&1 || true"; };
