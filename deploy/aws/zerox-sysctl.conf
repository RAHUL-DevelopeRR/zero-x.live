# /etc/sysctl.d/60-zerox.conf, installed by host-setup.sh.
# Both gateway instances listen on 127.0.0.1:8787 with SO_REUSEPORT (zerox-gateway@.service).
# When the old one stops during a deploy, connections already queued on its listener would be
# reset; with this (Linux 5.14 and later) the kernel hands them to the instance that stays.
net.ipv4.tcp_migrate_req = 1
