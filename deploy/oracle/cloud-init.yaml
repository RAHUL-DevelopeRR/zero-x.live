#cloud-config
# First boot of the Zero-X gateway VM: Ubuntu 24.04 aarch64 on OCI VM.Standard.A1.Flex
# (deploy/oracle/README.md, "Create the VM"). Holds no secret. Before launching, put the PUBLIC
# half of the deploy key (the GitHub secret ORACLE_SSH_KEY is its private half) in place of
# REPLACE_WITH_DEPLOY_PUBLIC_KEY:
#   sed "s|REPLACE_WITH_DEPLOY_PUBLIC_KEY|$(cat zerox-deploy.pub)|" cloud-init.yaml > /tmp/zerox-cloud-init.yaml
#
# Users: ubuntu (the image default, the operator's key from --ssh-authorized-keys-file, full
# sudo), deploy (GitHub Actions: owns the releases and the environment file, may only restart
# the gateway), zerox (runs the gateway and the cron; no shell, no SSH, read-only code).
#
# Firewall: the image's own iptables rules (/etc/iptables/rules.v4: replies, ICMP, loopback and
# SSH in, everything else rejected) behind the subnet's SSH-only security list. Nothing here
# installs, enables or configures UFW: Oracle's Ubuntu image documentation says not to, since
# UFW can remove the preinstalled rules that reach the boot volume and the instance may then not
# boot. A rule the gateway needs goes in /etc/iptables/rules.v4 (cloudflared only dials out, so
# none is needed today).
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - rsync
  - unattended-upgrades

users:
  - default
  - name: zerox
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
    lock_passwd: true
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    groups: [systemd-journal]
    ssh_authorized_keys:
      - REPLACE_WITH_DEPLOY_PUBLIC_KEY
    sudo:
      - "ALL=(root) NOPASSWD: /usr/bin/systemctl restart zerox-gateway.service, /usr/bin/systemctl is-active zerox-gateway.service, /usr/bin/systemctl status zerox-gateway.service"

write_files:
  # Key-only SSH for the two login users; everything else is refused.
  - path: /etc/ssh/sshd_config.d/60-zerox.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers ubuntu deploy
  # Security updates daily, plus Node.js (NodeSource) and cloudflared from their signed
  # repositories, installed in the night window only (apt-daily-upgrade.timer below, 20:45 to
  # 20:55 UTC, 02:15 IST). needrestart then restarts the services whose binaries or libraries
  # changed (zerox-gateway drains on SIGTERM for up to 110 s; cloudflared cuts open streams after
  # its 30 s grace), and a kernel update reboots at 21:30 UTC (03:00 IST).
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/52zerox-unattended-upgrades
    permissions: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
              "site=deb.nodesource.com";
              "site=pkg.cloudflare.com";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "21:30";
  # Ubuntu installs upgrades at 06:00 UTC plus up to 60 minutes (11:30 to 12:30 IST, midday
  # traffic). Moved to the night, finishing before the reboot time above. apt-daily.timer still
  # refreshes the lists and downloads at any hour; it installs nothing.
  - path: /etc/systemd/system/apt-daily-upgrade.timer.d/zerox.conf
    permissions: '0644'
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 20:45
      RandomizedDelaySec=10m
  # needrestart's choice made explicit: restart affected services without asking (they are only
  # replaced in the window above). Check with: sudo needrestart -b
  - path: /etc/needrestart/conf.d/zerox.conf
    permissions: '0644'
    content: |
      $nrconf{restart} = 'a';
  # Node.js comes from NodeSource only (Ubuntu's own nodejs is an older major).
  - path: /etc/apt/preferences.d/nodejs
    permissions: '0644'
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 600
  # Journal: bounded on the 50 GB boot volume, two weeks of history.
  - path: /etc/systemd/journald.conf.d/zerox.conf
    permissions: '0644'
    content: |
      [Journal]
      SystemMaxUse=1G
      SystemKeepFree=2G
      SystemMaxFileSize=100M
      MaxRetentionSec=14day
      RateLimitIntervalSec=30s
      RateLimitBurst=20000
  - path: /usr/local/sbin/zerox-bootstrap
    permissions: '0700'
    content: |
      #!/bin/bash
      # Repositories, Node.js 22, cloudflared and directories. Safe to run again.
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive

      # Node.js 22 (arm64) from NodeSource's signed apt repository.
      install -d -m 0755 /etc/apt/keyrings
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor --yes -o /etc/apt/keyrings/nodesource.gpg
      cat > /etc/apt/sources.list.d/nodesource.sources <<'EOF'
      Types: deb
      URIs: https://deb.nodesource.com/node_22.x/
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.gpg
      EOF
      # cloudflared from Cloudflare's signed apt repository (the "any" suite Cloudflare recommends).
      install -d -m 0755 /usr/share/keyrings
      curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
      echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' \
        > /etc/apt/sources.list.d/cloudflared.list
      apt-get update
      apt-get install -y nodejs cloudflared
      # The repository keys' fingerprints, to compare with what NodeSource and Cloudflare publish.
      gpg --show-keys --with-fingerprint /etc/apt/keyrings/nodesource.gpg /usr/share/keyrings/cloudflare-main.gpg \
        > /var/log/zerox-apt-keys.txt 2>&1 || true
      echo "node $(node --version), $(cloudflared --version)" > /var/log/zerox-bootstrap.txt

      # Releases: written by deploy, read by zerox (setgid keeps the zerox group on new files).
      install -d -o deploy -g zerox -m 2750 /opt/zerox /opt/zerox/releases
      # Environment file: written by deploy, read by systemd as root; zerox cannot read it.
      install -d -o deploy -g deploy -m 0700 /etc/zerox
      [ -e /etc/zerox/gateway.env ] || install -o deploy -g deploy -m 0600 /dev/null /etc/zerox/gateway.env
      install -d -o root -g root -m 0755 /etc/cloudflared

      # The firewall in force (the image's rules, header of this file), for the first-boot check.
      iptables -S INPUT >> /var/log/zerox-bootstrap.txt 2>&1 || true

runcmd:
  - [/usr/local/sbin/zerox-bootstrap]
  - [systemctl, restart, systemd-journald]
  - [systemctl, try-reload-or-restart, ssh]
  - [systemctl, daemon-reload]
  - [systemctl, restart, apt-daily-upgrade.timer]
