# /etc/cloudflared/config.yml: Cloudflare Tunnel for the Zero-X gateway (deploy/oracle/README.md).
# Replace <TUNNEL_ID> with the id `cloudflared tunnel create zerox-gw` printed. The credentials
# file (/etc/cloudflared/<TUNNEL_ID>.json, 0600 root) is the tunnel's secret: never commit it.
# cloudflared only dials out to Cloudflare (QUIC on UDP 7844, HTTP/2 on TCP 7844 as fallback);
# the VM opens no inbound port for it.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json
# /ready answers 200 while at least one connection to Cloudflare is up (loopback only).
metrics: 127.0.0.1:20241

originRequest:
  connectTimeout: 10s
  # Idle keep-alive connections to the gateway; the gateway's own keep-alive timeout is 5 s.
  keepAliveTimeout: 4s

# The first rule whose hostname and path (a regular expression on the URL path) match wins.
# Check one with: cloudflared tunnel --config /etc/cloudflared/config.yml ingress rule https://gw.zero-x.live/v1/models
ingress:
  # Operator-only under /v1 (operator token plus Cloudflare Access on the Worker, which serves it
  # on dashboard.zero-x.live): never through the tunnel, whatever the VM's Access settings.
  - hostname: gw.zero-x.live
    path: ^/v1/providers/
    service: http_status:404
  # Phase 1: the test hostname serves only what the Neuron CLI calls with
  # NEURON_API_BASE=https://gw.zero-x.live/v1 (completions and models under /v1, device sign-in,
  # session, account) and the health checks. The admin APIs, relay, releases, billing and
  # webhooks stay on the Worker (404 here).
  - hostname: gw.zero-x.live
    path: ^/(v1/.*|auth/device/(code|token)|auth/session|api/account|health|ready)$
    service: http://127.0.0.1:8787
  # Phase 2: zero-x.live/v1/* only. The Worker keeps zero-x.live/* through its route; a route
  # without a Worker on zero-x.live/v1/* lets these requests through to this tunnel.
  # - hostname: zero-x.live
  #   path: ^/v1/providers/
  #   service: http_status:404
  # - hostname: zero-x.live
  #   path: ^/v1/
  #   service: http://127.0.0.1:8787
  - service: http_status:404
