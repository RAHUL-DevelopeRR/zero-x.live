name = "zero-x-callback-api"
main = "src/index.js"
compatibility_date = "2024-05-02"

[assets]
directory = "../../"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[routes]]
pattern = "zero-x.live"
custom_domain = true

[[routes]]
pattern = "www.zero-x.live"
custom_domain = true

[[routes]]
pattern = "dashboard.zero-x.live"
custom_domain = true

[[routes]]
pattern = "neuron.zero-x.live"
custom_domain = true


[vars]

# The hosted model list is the verified catalog (docs/PLATFORM_CONTRACT.md sections 2 and 13): the
# approved catalog rows in the database (dashboard.zero-x.live/admin/models), each bounded by the
# code guardrails, over the code catalog in src/catalog.js. GROQ_MODELS / GEMINI_MODELS /
# CLOUDFLARE_MODELS / NVIDIA_MODELS / ANTHROPIC_MODELS can only narrow it (unknown ids are ignored
# and reported on /v1/providers/health); *_TOOL_MODELS are no longer read.
# OPENROUTER_MODELS narrows the OpenRouter models offered, hosted and BYOK alike.
OPENROUTER_MODELS = "cohere/north-mini-code:free,minimax/minimax-m3.1-flash:free"
SUPABASE_URL = "https://norrtosjwcossxrhhtvd.supabase.co"
# Public browser key. OAuth, SMTP, SMS and service-role secrets stay outside this repository.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Fgrm-Cfyj3w0xAfepK-CFg_SpUydF2T"
SUPABASE_AUTH_PROVIDERS = "google,email,phone,azure,github"
AZURE_OPENAI_ENDPOINT = "https://rahul-mok8ryyn-eastus2.services.ai.azure.com"
AZURE_API_VERSION = "2024-05-01-preview"
OPENROUTER_CLIENT_ID = "neuroncli"
OPENROUTER_CALLBACK_URL = "https://zero-x.live/neuroncli/callback/"
# Lifetime of CLI sessions (stored under sha256(token)): CLI_SESSION_TTL_HOURS after the last
# use, extended at most once a day, never beyond CLI_SESSION_MAX_DAYS after sign-in (needs the
# 20261023000000_session_devices migration; without it sessions end CLI_SESSION_TTL_HOURS after
# sign-in). SESSION_TTL_HOURS only applies to sessions created before hashed storage.
CLI_SESSION_TTL_HOURS = "720"
CLI_SESSION_MAX_DAYS = "90"
SESSION_TTL_HOURS = "24"
MAX_REQUESTS_PER_SESSION = "1000"
PRICING_URL = "https://zero-x.live/pricing"
# Operator decision (2026-10-19, alpha): the NVIDIA trial key and the OpenRouter operator key
# also serve users' free models. Their terms are summarised in docs/PROVIDER_TERMS.md.
NVIDIA_HOSTED = "true"
OPENROUTER_HOSTED = "true"
# Claude Sonnet 5.5 and Claude Opus 5.5 (paid pools, Pro and Max, billed from credits) use the
# Worker secret ANTHROPIC_API_KEY, which deploy.yml pushes from the GitHub secret; without it they
# list as not_configured. The same key enables the weekly discovery research and credits jobs;
# DISCOVERY_RESEARCH = "false" turns those off. ANTHROPIC_MODELS narrows the Claude models offered
# like the other *_MODELS: a second gate beside the list prices in src/list-prices.js, so the
# anthropic.paid key serves these two only, whatever catalog rows say. The base URL is pinned in code.
ANTHROPIC_MODELS = "claude-sonnet-5-5,claude-opus-5-5"
# DISCOVERY_RESEARCH = "false"
# Model catalog source (src/catalog-db.js). Unset: the approved database rows when the database is
# configured (cached 45 s per isolate; a database outage keeps the last catalog that loaded, else
# the code catalog). "code" is the kill switch: src/catalog.js only, whatever the rows say.
# CATALOG_DB_MODELS is no longer read: promoted discovery models are draft catalog rows.
# CATALOG_SOURCE = "code"
# Public Razorpay key id (rzp_live_...). RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET are
# Worker secrets; billing answers 503 billing_not_configured until all three are set.
RAZORPAY_KEY_ID = "rzp_live_TK43zZbnvcWZa8"
# Set to "true" once Content-Security-Policy-Report-Only shows no violations.
CSP_ENFORCE = "false"
# Cloudflare Access application on dashboard.zero-x.live/admin (provider key vault and model
# catalog pages, GATEWAY_SETUP.md step 5). With both set, the pages, /admin/providers/keys and
# /admin/catalog/* also verify the Access JWT. The vault itself needs the Worker secret
# PROVIDER_KEYS_KEK.
# CF_ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
# CF_ACCESS_AUD = "<application audience tag>"

# Neuron release manifests (docs/RELEASE_MANIFESTS.md). Off until the bucket exists: create it
# with `wrangler r2 bucket create neuron-releases`, then uncomment. Without it the Worker serves
# the committed releases/<product>/latest.json.
# [[r2_buckets]]
# binding = "RELEASES"
# bucket_name = "neuron-releases"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "717e03bfc7cf4efa84648ccd82e4c9ed"

[ai]
binding = "AI"

# HealthHub (src/health-hub.js): one Durable Object holding every pool's health, with a 30 s
# alarm for free checks and capped test requests. /v1/models reads it; without the binding the
# gateway falls back to sharing health through SESSIONS_KV.
[[durable_objects.bindings]]
name = "HEALTH_HUB"
class_name = "HealthHub"

[[migrations]]
tag = "v1-health-hub"
new_sqlite_classes = ["HealthHub"]

# RelayRoom (src/relay.js, docs/RELAY.md): one Durable Object per account that relays end-to-end
# encrypted frames between a computer running Neuron and the user's phone or browser.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v2-relay"
new_sqlite_classes = ["RelayRoom"]

# Releases stale quota reservations and applies subscription expiry (src/routes/admin.js), and
# runs provider discovery: each public model list once a day, OmniRoute and research once a week
# (src/discovery/jobs.js).
[triggers]
crons = ["*/10 * * * *"]
