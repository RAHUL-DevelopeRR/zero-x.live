name = "zero-x-callback-api"
main = "src/index.js"
compatibility_date = "2024-05-02"

[assets]
directory = "../../"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[routes]]
pattern = "zero-x.live"
custom_domain = true

[[routes]]
pattern = "www.zero-x.live"
custom_domain = true

[[routes]]
pattern = "dashboard.zero-x.live"
custom_domain = true

[[routes]]
pattern = "neuron.zero-x.live"
custom_domain = true


[vars]

# The hosted model list is the verified catalog in src/catalog.js (docs/PLATFORM_CONTRACT.md
# section 2). GROQ_MODELS / GEMINI_MODELS / CLOUDFLARE_MODELS / NVIDIA_MODELS can only narrow it
# (unknown ids are ignored and reported on /v1/providers/health); *_TOOL_MODELS are no longer read.
# OPENROUTER_MODELS is the allowlist for users' own OpenRouter keys (BYOK).
OPENROUTER_MODELS = "cohere/north-mini-code:free"
SUPABASE_URL = "https://norrtosjwcossxrhhtvd.supabase.co"
# Public browser key. OAuth, SMTP, SMS and service-role secrets stay outside this repository.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Fgrm-Cfyj3w0xAfepK-CFg_SpUydF2T"
SUPABASE_AUTH_PROVIDERS = "google,email,phone,azure,github"
AZURE_OPENAI_ENDPOINT = "https://rahul-mok8ryyn-eastus2.services.ai.azure.com"
AZURE_API_VERSION = "2024-05-01-preview"
OPENROUTER_CLIENT_ID = "neuroncli"
OPENROUTER_CALLBACK_URL = "https://zero-x.live/neuroncli/callback/"
# Lifetime of CLI sessions from sign-in (stored under sha256(token)). SESSION_TTL_HOURS only
# applies to sessions created before hashed storage.
CLI_SESSION_TTL_HOURS = "720"
SESSION_TTL_HOURS = "24"
MAX_REQUESTS_PER_SESSION = "1000"
PRICING_URL = "https://zero-x.live/pricing"
# Compliance defaults (docs/PROVIDER_TERMS.md): NVIDIA trial keys are evaluation-only and the
# OpenRouter operator key is not resold (BYOK only).
NVIDIA_HOSTED = "false"
OPENROUTER_HOSTED = "false"
# Public Razorpay key id (rzp_live_...). RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET are
# Worker secrets; billing answers 503 billing_not_configured until all three are set.
RAZORPAY_KEY_ID = ""
# Set to "true" once Content-Security-Policy-Report-Only shows no violations.
CSP_ENFORCE = "false"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "717e03bfc7cf4efa84648ccd82e4c9ed"

[ai]
binding = "AI"

# Releases stale quota reservations and applies subscription expiry (src/routes/admin.js).
[triggers]
crons = ["*/10 * * * *"]
