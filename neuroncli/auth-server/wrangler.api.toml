name = "neuron-gateway"
main = "src/index.js"
compatibility_date = "2026-10-06"
# request.signal fires when the client disconnects (no default-on date, see wrangler.toml).
compatibility_flags = ["enable_request_signal"]
workers_dev = true

# Operator supplies identity configuration and SESSIONS_KV binding before deploy.
# Provider keys are Worker secrets; Cloudflare AI works without client provider keys.
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
CLI_SESSION_TTL_HOURS = "720"
PRICING_URL = "https://zero-x.live/pricing"
NVIDIA_HOSTED = "false"
OPENROUTER_HOSTED = "false"
RAZORPAY_KEY_ID = ""

[triggers]
crons = ["*/10 * * * *"]
