name = "neuron-gateway"
main = "src/index.js"
compatibility_date = "2026-10-06"
workers_dev = true

# Operator supplies identity configuration and SESSIONS_KV binding before deploy.
# Provider keys are Worker secrets; Cloudflare AI works without client provider keys.
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
CLI_SESSION_TTL_HOURS = "720"
PRICING_URL = "https://zero-x.live/pricing"
NVIDIA_HOSTED = "false"
OPENROUTER_HOSTED = "false"
# With ANTHROPIC_API_KEY set, the anthropic.paid key serves these Claude models only (wrangler.toml).
ANTHROPIC_MODELS = "claude-sonnet-5-5,claude-opus-5-5"
RAZORPAY_KEY_ID = ""

[triggers]
crons = ["*/10 * * * *"]
