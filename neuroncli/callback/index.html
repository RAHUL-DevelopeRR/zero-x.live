<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting your account | Zero-X</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../Assets/zerox-favicon-32.png">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
    <link rel="preload" href="/fonts/aspekta-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/aspekta-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/zx-tokens.css">
    <link rel="stylesheet" href="/auth-pages.css">
</head>
<body class="ap">
    <header class="ap-top"><a class="zx-brand" href="https://zero-x.live/"><img src="/Assets/zerox-mark.svg" width="28" height="28" alt="">Zero-X</a></header>
    <main class="ap-main" id="main">
        <div class="ap-card" id="card">
            <p class="ap-status is-working" id="spinner" role="status">Working</p>
            <h1 id="title">Authenticating...</h1>
            <p id="message">Finishing your connection...</p>
            <div id="steps"></div>
            <div class="ap-session" id="session" hidden></div>
            <button class="zx-btn zx-btn--primary" id="copy-session" type="button" hidden>Copy gateway token</button>
            <p class="ap-meta" id="meta">zero-x.live</p>
        </div>
    </main>

    <script>
        const AUTH_SERVER = '/neuroncli/auth-server';
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        const state = params.get('state');
        const token = params.get('session_token');
        const provider = params.get('provider') || (code ? 'openrouter' : '');
        history.replaceState(null, '', location.pathname);
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        message.style.whiteSpace = 'pre-line';
        function finish(success, text) {
            spinner.className = 'ap-status zx-badge ' + (success ? 'zx-badge--success' : 'zx-badge--danger');
            spinner.textContent = success ? 'Done' : 'Failed';
            title.textContent = success ? 'Authentication Complete' : 'Authentication Failed';
            message.textContent = text;
        }
        async function complete() {
            try {
                if (provider === 'openrouter' && code && state) {
                    const response = await fetch(AUTH_SERVER + '/auth/openrouter/callback?' +
                        new URLSearchParams({code, state}), {signal: AbortSignal.timeout(15000)});
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok || !/^ses_[A-Za-z0-9_-]+$/.test(result.session_token || '')) throw new Error('Authorization exchange failed. Restart the provider connection.');
                    const session = document.getElementById('session');
                    const copy = document.getElementById('copy-session');
                    session.textContent = result.session_token;
                    session.hidden = copy.hidden = false;
                    copy.addEventListener('click', async () => {
                        try { await navigator.clipboard.writeText(result.session_token); copy.textContent = 'Copied'; }
                        catch { copy.textContent = 'Select and copy the token above'; }
                    });
                    finish(true, 'Your connection is ready. This is a gateway token. To sign in to Neuron, run neuron login in your terminal.');
                } else if (provider === 'azure' && token) {
                    const response = await fetch(AUTH_SERVER + '/auth/session', {
                        headers: {Authorization: 'Bearer ' + token}, signal: AbortSignal.timeout(15000)
                    });
                    if (!response.ok) throw new Error('Invalid or expired session. Restart authentication in your terminal.');
                    await response.json();
                    finish(true, 'Your gateway session was verified. To sign in to Neuron, run neuron login in your terminal.');
                } else {
                    finish(false, 'This page only completes a provider connection started from Zero-X. To sign in to Neuron, run neuron login and approve the code at https://neuron.zero-x.live/device.');
                }
            } catch (error) {
                finish(false, error.name === 'TimeoutError' ? 'Authentication timed out. Restart authentication in your terminal.' : error.message);
            }
        }
        complete();
    </script>
</body>
</html>
