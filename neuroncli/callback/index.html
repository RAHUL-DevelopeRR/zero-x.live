<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuronCLI — Auth Callback</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../Assets/zerox-favicon-32.png">
    <meta name="referrer" content="no-referrer">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: #08070b;
            color: #f0f0f0;
        }
        .card {
            text-align: center; padding: 48px 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            max-width: 480px;
            width: 90%;
        }
        .spinner {
            width: 36px; height: 36px; margin: 0 auto 20px;
            border: 2px solid rgba(94,106,210,0.15);
            border-top: 2px solid #5e6ad2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        h1 {
            font-size: 1.5em; font-weight: 600; margin-bottom: 8px;
            letter-spacing: -0.02em; animation: fade-in 0.4s ease;
        }
        p { color: #8a8a96; font-size: 0.95em; line-height: 1.7; }
        .success-icon {
            width: 48px; height: 48px; margin: 0 auto 20px;
            border-radius: 50%; background: rgba(45,140,60,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #2D8C3C;
        }
        .error-icon {
            width: 48px; height: 48px; margin: 0 auto 20px;
            border-radius: 50%; background: rgba(200,50,40,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #C83228;
        }
        .provider-badge {
            display: inline-block; margin: 8px auto 16px;
            padding: 4px 14px; border-radius: 20px;
            font-size: 0.78em; font-weight: 500;
            letter-spacing: 0.03em; text-transform: uppercase;
        }
        .provider-azure { background: rgba(0,120,212,0.15); color: #4fc3f7; border: 1px solid rgba(0,120,212,0.3); }
        .provider-openrouter { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
        .code-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 14px 16px; margin: 16px 0;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.82em; word-break: break-all;
            color: #F0A028; user-select: all;
        }
        .btn {
            display: inline-block; margin-top: 16px; padding: 10px 24px;
            background: #5e6ad2; color: #fff; border: none; border-radius: 8px;
            font-size: 0.9em; font-weight: 500; cursor: pointer;
            text-decoration: none; transition: background 0.2s;
        }
        .btn:hover { background: #6b77e0; }
        .meta { color: #555566; font-size: 0.78em; margin-top: 16px; }
        .steps { text-align: left; margin: 16px 0; padding-left: 20px; }
        .steps li { color: #8a8a96; font-size: 0.88em; margin-bottom: 6px; }
        .steps li.done { color: #2D8C3C; }
        .steps li.active { color: #5e6ad2; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">Authenticating...</h1>
        <div id="badge"></div>
        <p id="message">Connecting to NeuronCLI...</p>
        <div id="steps"></div>
        <p class="meta" id="meta">v6.2.4 · zero-x.live</p>
    </div>

    <script>
        const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
        const AUTH_SERVER = isLocal ? 'http://localhost:19284' : '/neuroncli/auth-server';
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        const state = params.get('state');
        const token = params.get('session_token');
        const provider = params.get('provider') || (code ? 'openrouter' : '');
        history.replaceState(null, '', location.pathname);
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const spinner = document.getElementById('spinner');
        message.style.whiteSpace = 'pre-line';
        function finish(success, text) {
            spinner.className = success ? 'success-icon' : 'error-icon';
            spinner.textContent = success ? '✓' : '✗';
            title.textContent = success ? 'Authentication Complete' : 'Authentication Failed';
            message.textContent = text;
        }
        async function complete() {
            try {
                if (provider === 'openrouter' && code && state) {
                    const response = await fetch(AUTH_SERVER + '/auth/openrouter/callback?' +
                        new URLSearchParams({code, state}), {signal: AbortSignal.timeout(15000)});
                    if (!response.ok) throw new Error('Authorization exchange failed. Restart neuron auth login in your terminal.');
                    finish(true, 'OpenRouter authorization exchanged. Check your terminal to confirm the connection.');
                } else if (provider === 'azure' && token) {
                    const response = await fetch(AUTH_SERVER + '/auth/azure/session', {
                        headers: {Authorization: 'Bearer ' + token}, signal: AbortSignal.timeout(15000)
                    });
                    if (!response.ok) throw new Error('Invalid or expired session. Restart authentication in your terminal.');
                    await response.json();
                    finish(true, 'Your session was verified. Check your terminal to confirm the connection.');
                } else {
                    finish(false, 'Start authentication from NeuronCLI using neuron auth login. This page requires a valid authentication callback.');
                }
            } catch (error) {
                finish(false, error.name === 'TimeoutError' ? 'Authentication timed out. Restart authentication in your terminal.' : error.message);
            }
        }
        complete();
    </script>
</body>
</html>
