<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex">
  <title>Connect Neuron | Zero-X</title>
  <link rel="icon" href="../../Assets/zerox-favicon-32.png">
  <link rel="stylesheet" href="/site-fonts.css">
  <link rel="stylesheet" href="/zx-tokens.css">
  <style>
    body{display:grid;place-items:center;padding:16px}.card{width:min(480px,100%);padding:32px 24px;text-align:center;border:1px solid var(--zx-border);border-radius:var(--zx-radius-lg);background:var(--zx-surface)}h1{font-size:1.75rem}p{color:var(--zx-muted);overflow-wrap:anywhere}#account{color:var(--zx-heading);font-weight:600}button{min-height:44px;padding:12px 24px;border:0;border-radius:999px;background:var(--zx-accent);color:var(--zx-on-accent);font:600 1rem var(--zx-font-body);cursor:pointer}button:hover{background:var(--zx-accent-h)}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:none;box-shadow:var(--zx-focus)}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script defer src="../../zerox-auth.js"></script>
  <script defer src="./login.js"></script>
</head>
<body>
  <main class="card">
    <h1>Connect Neuron</h1>
    <p id="message" role="status" aria-live="polite">Checking your sign-in…</p>
    <p id="account"></p>
    <button id="connect" type="button" hidden>Connect this account</button>
    <p>This page only completes sign-in for older Neuron builds that open a local callback. Neuron 7.0.0-alpha.1 signs in with a device code: run <code>neuron login</code> and approve the code at <a href="https://neuron.zero-x.live/device">neuron.zero-x.live/device</a>.</p>
    <a href="../../dashboard.html">Open account dashboard</a>
  </main>
</body>
</html>
