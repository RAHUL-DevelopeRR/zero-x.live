<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex">
  <title>Connect NeuronCLI | Zero-X</title>
  <link rel="icon" href="../../Assets/zerox-favicon-32.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08070b;color:#f0f0f0;font-family:Inter,-apple-system,'Segoe UI',sans-serif}.card{width:min(480px,90%);padding:40px;text-align:center;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(255,255,255,.03)}h1{font-size:24px}p{color:#a6a6b2;line-height:1.7;overflow-wrap:anywhere}button{min-height:44px;padding:12px 24px;border:0;border-radius:8px;background:#5e6ad2;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #00e5ff;outline-offset:4px}a{color:#00e5ff}#account{color:#f0f0f0}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../zerox-auth.js"></script>
  <script defer src="./login.js"></script>
</head>
<body>
  <main class="card">
    <h1>Connect NeuronCLI</h1>
    <p id="message" role="status" aria-live="polite">Checking your sign-in…</p>
    <p id="account"></p>
    <button id="connect" type="button" hidden>Connect this account</button>
    <p>Start this connection from <code>neuron auth login</code> in your terminal.</p>
    <a href="../../dashboard.html">Open account dashboard</a>
  </main>
</body>
</html>
